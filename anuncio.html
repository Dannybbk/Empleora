<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle del Anuncio - Roda Trabajo</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body style="background: #f8fafc; font-family: 'Inter', sans-serif; margin: 0; padding: 0;">
  <header style="background: #fff; border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; z-index: 40;">
    <div class="container nav" style="max-width: 1100px; margin: 0 auto; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center;">
      <a href="index.html" class="logo" style="display: flex; align-items: center; gap: 8px; text-decoration: none; color: #1a1a1a; font-weight: 800; font-size: 17px;"><img src="logo.jpg" alt="Roda Trabajo" style="width: 32px; height: 32px; border-radius: 8px; object-fit: contain;"> RODA TRABAJO</a>
      <ul class="nav-links" style="list-style: none; display: flex; gap: 16px; margin: 0; padding: 0;">
        <li><a href="index.html" style="text-decoration: none; color: #78716c; font-weight: 600; font-size: 13px;">Inicio</a></li>
        <li><a href="buscar.html" style="text-decoration: none; color: #78716c; font-weight: 600; font-size: 13px;">Buscar</a></li>
        <li><a href="publicar.html" style="text-decoration: none; color: #78716c; font-weight: 600; font-size: 13px;">Publicar</a></li>
      </ul>
    </div>
  </header>

  <main class="container" style="padding: 40px 16px; max-width: 800px; margin: 0 auto;">
    <div id="ad-detail" style="background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:30px; box-shadow:0 4px 6px rgba(0,0,0,0.05);">
      <p style="text-align:center; color:#64748b;">Cargando anuncio...</p>
    </div>
    
    <div style="margin-top: 20px;">
      <a href="buscar.html" class="btn" style="background:#64748b; color:#fff; text-decoration:none; padding:10px 20px; border-radius:6px; display:inline-block; font-size: 13px; font-weight: 600;">&larr; Volver a la búsqueda</a>
    </div>
  </main>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://ctkiiimazwpztekwfnrn.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_xkq1LHED5KxRpR35NRciCw_Na00Hi87';
    let cliente;

    document.addEventListener('DOMContentLoaded', async () => {
      const container = document.getElementById('ad-detail');
      
      const urlParams = new URLSearchParams(window.location.search);
      const adId = urlParams.get('id') || urlParams.get('anuncio');

      if (!adId) {
        container.innerHTML = '<h2 style="color:#ef4444;">Anuncio no encontrado</h2><p>No se ha especificado ningún identificador válido.</p>';
        return;
      }

      try {
        cliente = window.supabaseClient || window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const { data: ad, error } = await cliente
          .from('ads')
          .select('*, categories(name)')
          .eq('id', adId)
          .single();

        if (error || !ad) {
          container.innerHTML = '<h2 style="color:#ef4444;">No disponible</h2><p>El anuncio no existe o ha sido eliminado.</p>';
          return;
        }

        let sellerName = 'Anunciante Roda';
        let sellerAvatarHtml = 'RT';

        if (ad.user_id) {
          const { data: perfil } = await cliente
            .from('profiles')
            .select('full_name, avatar_url')
            .eq('id', ad.user_id)
            .single();

          if (perfil) {
            if (perfil.full_name) sellerName = perfil.full_name;
            if (perfil.avatar_url) {
              sellerAvatarHtml = `<img src="${perfil.avatar_url}" alt="${sellerName}" style="width: 100%; height: 100%; object-fit: contain; background: #f1f5f9;">`;
            } else {
              sellerAvatarHtml = sellerName.charAt(0).toUpperCase();
            }
          }
        }

        const esOferta = ad.tipo === 'oferta' || ad.category === 'oferta' || ad.sueldo || ad.salary;
        const sueldoTexto = ad.sueldo || ad.salary || ad.sueldo_anuncio;
        const imagenAnuncio = ad.image_url || ad.image || ad.foto;

        container.innerHTML = `
          ${imagenAnuncio ? `
            <div style="width: 100%; max-height: 450px; background: #0f172a; border-radius: 8px; overflow: hidden; margin-bottom: 20px; display: flex; align-items: center; justify-content: center;">
              <img src="${imagenAnuncio}" alt="${ad.title || 'Anuncio'}" style="max-width: 100%; max-height: 450px; width: auto; height: auto; object-fit: contain; display: block; margin: 0 auto;">
            </div>
          ` : ''}

          <h1 style="color:#1e293b; margin-bottom:12px; font-size: 22px;">${ad.title || ad.profession || 'Detalle del puesto'}</h1>
          
          <div style="color:#64748b; font-size:14px; margin-bottom:20px; border-bottom:1px solid #e2e8f0; padding-bottom:16px;">
            <div style="margin-bottom: 10px;">
              <strong>Categoría:</strong> ${ad.categories?.name || ad.category || 'General'} &bull; 
              <strong>Ubicación:</strong> ${ad.city || ad.province || 'España'} &bull; 
              <strong>Publicado:</strong> ${new Date(ad.created_at).toLocaleDateString('es-ES')}
            </div>

            <div style="display: flex; align-items: center; gap: 10px; background: #f8fafc; padding: 8px 12px; border-radius: 8px; border: 1px solid #e2e8f0; width: fit-content; margin-top: 10px;">
              <div style="width: 36px; height: 36px; border-radius: 50%; background: #2563eb; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; overflow: hidden; flex-shrink: 0;">
                ${sellerAvatarHtml}
              </div>
              <div style="display: flex; flex-direction: column; line-height: 1.2;">
                <span style="font-size: 10px; color: #64748b; text-transform: uppercase; font-weight: 600;">Publicado por</span>
                <span style="font-weight: 700; font-size: 13px; color: #1e293b;">${sellerName}</span>
              </div>
            </div>
          </div>

          ${esOferta && sueldoTexto ? `
            <div style="background: #f8fafc; padding: 14px; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom:24px;">
              <span style="font-size: 12px; color: #64748b; display: block; margin-bottom: 2px;">SUELDO</span>
              <strong style="color: #16a34a; font-size: 15px;">${sueldoTexto}</strong>
            </div>
          ` : ''}
          
          <div style="margin-bottom:24px;">
            <h3 style="color:#334155; margin-bottom:8px; font-size: 16px;">Descripción del puesto</h3>
            <p style="color:#475569; line-height:1.6; white-space: pre-line; font-size: 14px;">${ad.description || ad.experience || 'Sin descripción detallada.'}</p>
          </div>

          <!-- FORMULARIO DE CONTACTO INTERNO -->
          <div style="background:#eff6ff; padding:20px; border-radius:8px; border:1px solid #bfdbfe;">
            <h3 style="color:#1e40af; margin-bottom:10px; font-size:18px;">¿Te interesa este anuncio? ¡Contacta ahora!</h3>
            <p style="color:#3b82f6; font-size:14px; margin-bottom:15px;">Rellena tus datos, añade una foto tuya si lo deseas y envíalo al anunciante.</p>
            
            <div id="contact-form-div" style="display:grid; gap:12px;">
              <div>
                <label style="display:block; font-size:13px; font-weight:500; color:#1e3a8a; margin-bottom:4px;">Tu Nombre</label>
                <input type="text" id="contact-name" placeholder="Ej. María Pérez" style="width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:6px; box-sizing:border-box; font-size: 14px;">
              </div>
              <div>
                <label style="display:block; font-size:13px; font-weight:500; color:#1e3a8a; margin-bottom:4px;">Tu Teléfono</label>
                <input type="tel" id="contact-phone" placeholder="Ej. 600123456" style="width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:6px; box-sizing:border-box; font-size: 14px;">
              </div>
              <div>
                <label style="display:block; font-size:13px; font-weight:500; color:#1e3a8a; margin-bottom:4px;">Tu Correo Electrónico</label>
                <input type="email" id="contact-email" placeholder="Ej. correo@email.com" style="width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:6px; box-sizing:border-box; font-size: 14px;">
              </div>
              <div>
                <label style="display:block; font-size:13px; font-weight:500; color:#1e3a8a; margin-bottom:4px;">Tu Mensaje</label>
                <textarea id="contact-msg" rows="4" placeholder="Hola, estoy muy interesado/a en este puesto..." style="width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:6px; box-sizing:border-box; font-size: 14px;"></textarea>
              </div>
              
              <!-- CAMPO DE FOTO DEL CANDIDATO -->
              <div>
                <label style="display:block; font-size:13px; font-weight:500; color:#1e3a8a; margin-bottom:4px;">Tu Foto (Opcional)</label>
                <input type="file" id="contact-photo" accept="image/*" style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:6px; box-sizing:border-box; font-size: 13px; background:#fff;">
                <span style="font-size:11px; color:#64748b; display:block; margin-top:2px;">Sube una foto tuya para que el anunciante te conozca.</span>
              </div>

              <button type="button" id="btn-submit-msg" style="background:#2563eb; color:#fff; padding:12px; border:none; border-radius:6px; font-weight:600; cursor:pointer; font-size: 14px;">Enviar mensaje y foto al anunciante</button>
            </div>
            <div id="form-success" style="display:none; margin-top:12px; color:#166534; font-weight:600; text-align:center; font-size: 14px;">¡Mensaje y foto enviados con éxito al panel del anunciante!</div>
          </div>
        `;

        document.getElementById('btn-submit-msg').addEventListener('click', async () => {
          const btn = document.getElementById('btn-submit-msg');
          const nombre = document.getElementById('contact-name').value.trim();
          const telefono = document.getElementById('contact-phone').value.trim();
          const email = document.getElementById('contact-email').value.trim();
          const mensaje = document.getElementById('contact-msg').value.trim();
          const photoInput = document.getElementById('contact-photo');

          if (!nombre || !mensaje) {
            alert('Por favor, rellena al menos tu nombre y el mensaje.');
            return;
          }

          btn.innerText = 'Subiendo y enviando...';
          btn.disabled = true;

          let fotoUrl = null;

          if (photoInput && photoInput.files && photoInput.files[0]) {
            const file = photoInput.files[0];
            const fileExt = file.name.split('.').pop();
            const fileName = `candidato_${Date.now()}_${Math.random().toString(36).substring(2)}.${fileExt}`;
            const filePath = `candidatos/${fileName}`;

            const { error: uploadError } = await cliente.storage
              .from('ads')
              .upload(filePath, file);

            if (uploadError) {
              alert('Error al subir la foto: ' + uploadError.message);
              btn.disabled = false;
              btn.innerText = 'Enviar mensaje y foto al anunciante';
              return;
            }

            const { data: publicData } = cliente.storage
              .from('ads')
              .getPublicUrl(filePath);

            fotoUrl = publicData.publicUrl;
          }

          const { error: insertError } = await cliente
            .from('messages')
            .insert([
              {
                ad_id: ad.id,
                ad_title: ad.title || ad.titulo || 'Oferta',
                receiver_id: ad.user_id,
                sender_name: nombre,
                sender_phone: telefono,
                sender_email: email,
                body: mensaje,
                image_url: fotoUrl
              }
            ]);

          if (insertError) {
            alert('Error al enviar el mensaje: ' + insertError.message);
            btn.disabled = false;
            btn.innerText = 'Enviar mensaje y foto al anunciante';
          } else {
            document.getElementById('contact-form-div').style.display = 'none';
            document.getElementById('form-success').style.display = 'block';
          }
        });

      } catch (err) {
        console.error('Error inesperado:', err);
        container.innerHTML = '<p style="color:#ef4444;">Ocurrió un error al cargar los detalles del anuncio.</p>';
      }
    });
  </script>
</body>
</html>
