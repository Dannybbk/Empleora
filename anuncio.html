<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anuncio - Empleora</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header>
    <div class="container nav">
      <a href="index.html" class="logo"><img src="logo.jpg" alt="Empleora"> EMPLEORA</a>
      <ul class="nav-links">
        <li><a href="buscar.html">Volver a buscar</a></li>
      </ul>
    </div>
  </header>

  <main class="container" style="padding:40px 0; max-width:800px;" id="ad-detail">
    <p>Cargando anuncio...</p>
  </main>

  <script src="js/config.js"></script>
  <script>
    async function loadAd() {
      const id = new URLSearchParams(window.location.search).get('id');
      if (!id) return;
      const { data, error } = await supabase.from('ads')
        .select('*, categories(name)')
        .eq('id', id)
        .eq('status', 'approved')
        .single();

      const container = document.getElementById('ad-detail');
      if (error || !data) {
        container.innerHTML = '<p>Anuncio no encontrado o no aprobado.</p>';
        return;
      }

      container.innerHTML = `
        <h1 style="color:var(--primary);">${data.title}</h1>
        <p style="color:var(--text-muted); margin:8px 0 24px;">${data.profession} • ${data.city}, ${data.province} • ${data.categories?.name || ''}</p>
        <div style="background:#f8f9fa; padding:20px; border-radius:12px; margin-bottom:20px;">
          <h3>Descripción</h3>
          <p>${data.description}</p>
        </div>
        ${data.experience ? `<div style="margin-bottom:16px;"><strong>Experiencia:</strong> ${data.experience}</div>` : ''}
        ${data.skills ? `<div style="margin-bottom:16px;"><strong>Habilidades:</strong> ${data.skills}</div>` : ''}
        ${data.jornada ? `<div style="margin-bottom:16px;"><strong>Jornada:</strong> ${data.jornada}</div>` : ''}
        ${data.disponibilidad ? `<div style="margin-bottom:16px;"><strong>Disponibilidad:</strong> ${data.disponibilidad}</div>` : ''}
        <p style="margin-top:24px; color:var(--text-muted);">Publicado el ${new Date(data.created_at).toLocaleDateString('es-ES')}</p>
        <button onclick="reportAd('${data.id}')" class="btn btn-outline" style="margin-top:16px;">Denunciar anuncio</button>
      `;
    }

    async function reportAd(id) {
      const reason = prompt('Motivo de la denuncia:');
      if (!reason) return;
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) {
        alert('Debes iniciar sesión para denunciar.');
        return;
      }
      await supabase.from('reports').insert([{ ad_id: id, reporter_id: session.user.id, reason }]);
      alert('Denuncia enviada. Gracias.');
    }

    loadAd();
  </script>
</body>
</html>
