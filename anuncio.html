<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle del Anuncio - Empleora</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <div class="container nav">
      <a href="index.html" class="logo"><img src="logo.jpg" alt="Empleora"> EMPLEORA</a>
      <ul class="nav-links">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="buscar.html">Buscar</a></li>
        <li><a href="publicar.html">Publicar</a></li>
      </ul>
    </div>
  </header>

  <main class="container" style="padding: 40px 0; max-width: 800px;">
    <!-- Contenedor principal del anuncio -->
    <div id="ad-detail" style="background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:30px; box-shadow:0 4px 6px rgba(0,0,0,0.05);">
      <p style="text-align:center; color:#64748b;">Cargando anuncio...</p>
    </div>
    
    <div style="margin-top: 20px;">
      <a href="buscar.html" class="btn" style="background:#64748b; color:#fff; text-decoration:none; padding:10px 20px; border-radius:6px; display:inline-block;">&larr; Volver a la búsqueda</a>
    </div>
  </main>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://ctkiiimazwpztekwfnrn.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_xkq1LHED5KxRpR35NRciCw_Na00Hi87';

    document.addEventListener('DOMContentLoaded', async () => {
      const container = document.getElementById('ad-detail');
      
      const urlParams = new URLSearchParams(window.location.search);
      const adId = urlParams.get('id') || urlParams.get('anuncio');

      if (!adId) {
        container.innerHTML = '<h2 style="color:#ef4444;">Anuncio no encontrado</h2><p>No se ha especificado ningún identificador válido.</p>';
        return;
      }

      try {
        const cliente = window.supabaseClient || window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const { data: ad, error } = await cliente
          .from('ads')
          .select('*, categories(name)')
          .eq('id', adId)
          .single();

        if (error || !ad) {
          console.error('Error al cargar:', error);
          container.innerHTML = '<h2 style="color:#ef4444;">No disponible</h2><p>El anuncio no existe o ha sido eliminado.</p>';
          return;
        }

        const emailContacto = ad.contact_email || ad.email || ad.user_email;
        const telefonoContacto = ad.contact_phone || ad.phone || ad.telefono;

        container.innerHTML = `
          <h1 style="color:#1e293b; margin-bottom:12px;">${ad.title || ad.profession || 'Detalle del puesto'}</h1>
          <div style="color:#64748b; font-size:15px; margin-bottom:20px; border-bottom:1px solid #e2e8f0; padding-bottom:12px;">
            <strong>Categoría:</strong> ${ad.categories?.name || ad.category || 'General'} &bull; 
            <strong>Ubicación:</strong> ${ad.city || ad.province || 'España'} &bull; 
            <strong>Publicado:</strong> ${new Date(ad.created_at).toLocaleDateString('es-ES')}
          </div>
          
          <div style="margin-bottom:24px;">
            <h3 style="color:#334155; margin-bottom:8px;">Descripción del puesto</h3>
            <p style="color:#475569; line-height:1.6; white-space: pre-line;">${ad.description || ad.experience || 'Sin descripción detallada.'}</p>
          </div>

          <div style="background:#f8fafc; padding:20px; border-radius:8px; border:1px solid #e2e8f0; margin-bottom: 24px;">
            <h3 style="color:#334155; margin-bottom:12px; font-size:16px;">Forma de contacto directa</h3>
            ${emailContacto || telefonoContacto ? `
              ${emailContacto ? `<p style="margin:6px 0;"><strong>Correo electrónico:</strong> <a href="mailto:${emailContacto}" style="color:#2563eb;">${emailContacto}</a></p>` : ''}
              ${telefonoContacto ? `<p style="margin:6px 0;"><strong>Teléfono / WhatsApp:</strong> <a href="tel:${telefonoContacto}" style="color:#2563eb;">${telefonoContacto}</a></p>` : ''}
            ` : `
              <p style="color:#64748b; margin:0;">Este anunciante no ha indicado un teléfono o correo directo.</p>
            `}
          </div>

          <!-- Formulario de contacto para interesados -->
          <div style="background:#eff6ff; padding:20px; border-radius:8px; border:1px solid #bfdbfe;">
            <h3 style="color:#1e40af; margin-bottom:10px; font-size:18px;">¿Te interesa este anuncio? ¡Contacta ahora!</h3>
            <p style="color:#3b82f6; font-size:14px; margin-bottom:15px;">Rellena tus datos y tu mensaje para enviar tu candidatura o consulta.</p>
            
            <form id="contact-form" style="display:grid; gap:12px;">
              <div>
                <label style="display:block; font-size:14px; font-weight:500; color:#1e3a8a; margin-bottom:4px;">Tu Nombre</label>
                <input type="text" id="contact-name" required placeholder="Ej. María Pérez" style="width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:6px; box-sizing:border-box;">
              </div>
              <div>
                <label style="display:block; font-size:14px; font-weight:500; color:#1e3a8a; margin-bottom:4px;">Teléfono o Correo de contacto</label>
                <input type="text" id="contact-info" required placeholder="Ej. 600123456 o correo@email.com" style="width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:6px; box-sizing:border-box;">
              </div>
              <div>
                <label style="display:block; font-size:14px; font-weight:500; color:#1e3a8a; margin-bottom:4px;">Tu Mensaje</label>
                <textarea id="contact-msg" rows="4" required placeholder="Hola, estoy muy interesado/a en este puesto..." style="width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:6px; box-sizing:border-box;"></textarea>
              </div>
              <button type="submit" class="btn" style="background:#2563eb; color:#fff; padding:12px; border:none; border-radius:6px; font-weight:600; cursor:pointer;">Enviar mensaje al anunciante</button>
            </form>
            <div id="form-success" style="display:none; margin-top:12px; color:#166534; font-weight:600; text-align:center;">¡Mensaje enviado con éxito! Nos pondremos en contacto contigo pronto.</div>
          </div>
        `;

        // Lógica al enviar el formulario
        const form = document.getElementById('contact-form');
        if (form) {
          form.addEventListener('submit', (e) => {
            e.preventDefault();
            form.style.display = 'none';
            document.getElementById('form-success').style.display = 'block';
          });
        }

      } catch (err) {
        console.error('Error inesperado:', err);
        container.innerHTML = '<p style="color:#ef4444;">Ocurrió un error al cargar los detalles del anuncio.</p>';
      }
    });
  </script>
</body>
</html>
