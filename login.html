<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso / Registro - Empleora</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    :root {
      --primary: #10b981;
      --primary-dark: #059669;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --bg-light: #f8fafc;
      --border-color: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg-light); color: var(--text-dark); line-height: 1.5; }
    header { background: #ffffff; border-bottom: 1px solid var(--border-color); }
    .nav-container { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; max-width: 1100px; margin: 0 auto; }
    .logo-area { display: flex; align-items: center; gap: 10px; font-weight: 700; color: var(--text-dark); text-decoration: none; font-size: 20px; }
    .logo-area img { height: 32px; border-radius: 4px; }
    .container { max-width: 450px; margin: 40px auto; padding: 0 20px; }
    .auth-box { background: #ffffff; border: 1px solid var(--border-color); border-radius: 12px; padding: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; text-align: center; }
    p.subtitle { color: var(--text-muted); font-size: 14px; text-align: center; margin-bottom: 24px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-dark); }
    input, select { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px; background: #fff; }
    input:focus, select:focus { outline: none; border-color: var(--primary); }
    .btn { width: 100%; padding: 12px; background: var(--primary); color: #ffffff; border: none; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; transition: background 0.2s; margin-top: 8px; }
    .btn:hover { background: var(--primary-dark); }
    .toggle-text { text-align: center; margin-top: 20px; font-size: 14px; color: var(--text-muted); }
    .toggle-text a { color: var(--primary); font-weight: 600; text-decoration: none; cursor: pointer; }
    .alert { padding: 12px; border-radius: 6px; font-size: 13px; margin-bottom: 16px; display: none; text-align: center; }
    .alert-error { background: #fef2f2; color: #ef4444; border: 1px solid #fca5a5; }
    .alert-success { background: #f0fdf4; color: #166534; border: 1px solid #86efac; }
  </style>
</head>
<body>

  <header>
    <div class="nav-container">
      <a href="index.html" class="logo-area">
        <img src="logo.jpg" alt="Empleora" onerror="this.style.display='none'"> EMPLEORA
      </a>
    </div>
  </header>

  <main class="container">
    <div class="auth-box">
      <!-- Formulario Iniciar Sesión -->
      <div id="login-form-wrapper">
        <h1>Iniciar sesión</h1>
        <p class="subtitle">Accede a tu panel para gestionar tus anuncios.</p>
        
        <div id="login-alert" class="alert alert-error"></div>

        <form id="login-form">
          <div class="form-group">
            <label>Correo electrónico</label>
            <input type="email" id="login-email" placeholder="tu@email.com" required>
          </div>
          <div class="form-group">
            <label>Contraseña</label>
            <input type="password" id="login-password" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn">Entrar a mi panel</button>
        </form>

        <div class="toggle-text">
          ¿No tienes cuenta? <a onclick="toggleForms(true)">Regístrate gratis</a>
        </div>
      </div>

      <!-- Formulario Registro -->
      <div id="register-form-wrapper" style="display: none;">
        <h1>Crear cuenta gratis</h1>
        <p class="subtitle">Elige tu tipo de perfil y publica tus anuncios.</p>
        
        <div id="register-alert" class="alert"></div>

        <form id="register-form">
          <div class="form-group">
            <label>Tipo de Perfil</label>
            <select id="reg-role" required>
              <option value="particular">👤 Particular (Busco trabajo o servicio puntual)</option>
              <option value="profesional">💼 Profesional / Empresa / Autónomo</option>
            </select>
          </div>
          <div class="form-group">
            <label>Correo electrónico</label>
            <input type="email" id="reg-email" placeholder="tu@email.com" required>
          </div>
          <div class="form-group">
            <label>Contraseña</label>
            <input type="password" id="reg-password" placeholder="Mínimo 6 caracteres" required minlength="6">
          </div>
          <button type="submit" class="btn">Crear mi cuenta</button>
        </form>

        <div class="toggle-text">
          ¿Ya tienes cuenta? <a onclick="toggleForms(false)">Inicia sesión</a>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://ctkiiimazwpztekwfnrn.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_xkq1LHED5KxRpR35NRciCw_Na00Hi87';
    const ADMIN_EMAIL = 'danny10bbk@gmail.com';

    function toggleForms(showRegister) {
      document.getElementById('login-form-wrapper').style.display = showRegister ? 'none' : 'block';
      document.getElementById('register-form-wrapper').style.display = showRegister ? 'block' : 'none';
    }

    document.addEventListener('DOMContentLoaded', () => {
      const cliente = window.supabaseClient || window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      // Login
      document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const alertBox = document.getElementById('login-alert');
        alertBox.style.display = 'none';

        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;

        const { data, error } = await cliente.auth.signInWithPassword({ email, password });

        if (error) {
          alertBox.innerText = 'Correo o contraseña incorrectos.';
          alertBox.style.display = 'block';
        } else {
          if (email === ADMIN_EMAIL) {
            window.location.href = 'admin.html';
          } else {
            window.location.href = 'mis-anuncios.html';
          }
        }
      });

      // Registro
      document.getElementById('register-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const alertBox = document.getElementById('register-alert');
        alertBox.style.display = 'none';

        const role = document.getElementById('reg-role').value;
        const email = document.getElementById('reg-email').value;
        const password = document.getElementById('reg-password').value;

        const { data, error } = await cliente.auth.signUp({
          email,
          password,
          options: {
            data: { user_role: role }
          }
        });

        if (error) {
          alertBox.className = 'alert alert-error';
          alertBox.innerText = error.message || 'Error al crear la cuenta.';
          alertBox.style.display = 'block';
        } else {
          alertBox.className = 'alert alert-success';
          alertBox.innerText = '¡Cuenta creada con éxito! Ya puedes iniciar sesión.';
          alertBox.style.display = 'block';
          setTimeout(() => toggleForms(false), 2000);
        }
      });
    });
  </script>
</body>
</html>
