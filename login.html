<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión - Empleora</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <h1 style="text-align:center; color:#1B4332;">Iniciar sesión</h1>
  <form id="login-form" style="max-width:400px; margin:40px auto; padding:0 16px;">
    <input type="email" name="email" placeholder="Email" required style="width:100%; padding:12px; margin-bottom:12px; border:1px solid #ccc; border-radius:8px;">
    <input type="password" name="password" placeholder="Contraseña" required style="width:100%; padding:12px; margin-bottom:16px; border:1px solid #ccc; border-radius:8px;">
    <button type="submit" style="width:100%; padding:14px; background:#52B788; color:white; border:none; border-radius:8px; font-weight:bold;">Iniciar sesión</button>
  </form>
  <p id="message" style="text-align:center;"></p>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabase = window.supabase.createClient(
      'https://ctkiiimazwpztekpfnrn.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0a2lpaW1hendwenRla3dmbnJuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIyMzkxMDYsImV4cCI6MjEwNzgxNTEwNn0.Ck7I90BIhDgTKSzbnHKothXKXc91ViJkpDyDkAFhYwk'
    );

    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const email = e.target.email.value;
      const password = e.target.password.value;
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      const msg = document.getElementById('message');
      if (error) {
        msg.style.color = 'red';
        msg.textContent = error.message;
      } else {
        msg.style.color = 'green';
        msg.textContent = 'Sesión iniciada';
        setTimeout(() => window.location.href = 'admin.html', 1000);
      }
    });
  </script>
</body>
</html>
