<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis anuncios - Roda Trabajo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: {
            brand: {
              50: '#faf6f1', 100: '#f0e6d8', 200: '#e0ccb0',
              500: '#8B5E3C', 600: '#6B4423', 700: '#4A2F18',
              800: '#3A2414', 900: '#1a1a1a'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-stone-50 text-stone-800 font-sans antialiased min-h-screen flex flex-col">

  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur border-b border-stone-200">
    <div class="max-w-4xl mx-auto px-4 h-14 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-brand-900 text-brand-100 flex items-center justify-center text-xs font-black">RT</div>
        <span class="font-extrabold text-brand-900 text-sm sm:text-base">Roda Trabajo</span>
      </a>
      <nav class="flex items-center gap-2 sm:gap-3 text-sm font-semibold">
        <a href="index.html" class="text-stone-600 hover:text-brand-600 hidden sm:inline">Inicio</a>
        <a href="publicar.html" class="px-3 py-1.5 bg-brand-600 hover:bg-brand-700 text-white rounded-lg text-xs sm:text-sm">Publicar</a>
        <button onclick="logoutUser()" class="text-stone-600 hover:text-red-600 text-xs sm:text-sm">Cerrar sesión</button>
      </nav>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-8 w-full flex-1 space-y-6">

    <!-- PERFIL -->
    <div class="bg-white p-5 sm:p-6 rounded-2xl border border-stone-200 shadow-sm flex flex-col sm:flex-row items-center gap-4">
      <div class="relative">
        <img id="user-avatar-img" class="w-16 h-16 sm:w-20 sm:h-20 rounded-full object-cover bg-stone-100 border-2 border-brand-200" src="" alt="Avatar">
        <label class="absolute -bottom-1 -right-1 w-7 h-7 bg-brand-600 text-white rounded-full flex items-center justify-center cursor-pointer hover:bg-brand-700 shadow">
          <i class="fa-solid fa-camera text-xs"></i>
          <input type="file" id="avatar-input" accept="image/*" class="hidden" onchange="uploadAvatar(event)">
        </label>
      </div>
      <div class="text-center sm:text-left flex-1 space-y-2 w-full">
        <div>
          <label class="block text-xs font-bold uppercase text-stone-400 mb-1">Nombre público</label>
          <div class="flex gap-2">
            <input type="text" id="profile-name" placeholder="Tu nombre o empresa"
              class="flex-1 px-3 py-2 bg-stone-50 border border-stone-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
            <button type="button" onclick="saveProfileName()" class="px-3 py-2 bg-brand-600 hover:bg-brand-700 text-white text-xs font-bold rounded-xl shrink-0">
              Guardar
            </button>
          </div>
        </div>
        <p class="text-xs text-stone-500" id="user-email-title"></p>
        <p class="text-xs text-stone-400" id="profile-tag">Particular</p>
      </div>
      <a href="publicar.html" class="w-full sm:w-auto text-center px-4 py-2.5 bg-brand-900 hover:bg-brand-800 text-white text-sm font-bold rounded-xl shrink-0">
        + Nuevo anuncio
      </a>
    </div>

    <!-- MENSAJES -->
    <div>
      <h2 class="text-lg font-bold text-brand-900 mb-3 flex items-center gap-2">
        <i class="fa-solid fa-inbox text-brand-600"></i> Mensajes recibidos
        <span id="msg-count" class="hidden text-xs font-bold bg-red-500 text-white px-2 py-0.5 rounded-full"></span>
      </h2>
      <div id="messages-container" class="space-y-3">
        <p class="text-stone-500 text-sm py-4 text-center">Cargando mensajes...</p>
      </div>
    </div>

    <!-- ANUNCIOS -->
    <div>
      <h2 class="text-lg font-bold text-brand-900 mb-3">Tus anuncios</h2>
      <div id="user-ads-container" class="space-y-3">
        <p class="text-stone-500 text-sm py-6 text-center">Cargando...</p>
      </div>
    </div>
  </main>

  <div id="edit-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
    <div class="bg-white p-5 sm:p-6 rounded-2xl shadow-2xl w-full max-w-md border border-stone-200 space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center">
        <h2 class="font-bold text-brand-900">Editar anuncio</h2>
        <button onclick="closeEditModal()" class="w-8 h-8 rounded-full bg-stone-100 flex items-center justify-center text-stone-600"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form id="edit-form" class="space-y-3">
        <input type="hidden" id="edit-id">
        <div>
          <label class="block text-xs font-bold uppercase text-stone-500 mb-1">Título</label>
          <input type="text" id="edit-title" required class="w-full px-3 py-2.5 bg-stone-50 border border-stone-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
        </div>
        <div>
          <label class="block text-xs font-bold uppercase text-stone-500 mb-1">Ubicación</label>
          <input type="text" id="edit-city" required class="w-full px-3 py-2.5 bg-stone-50 border border-stone-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
        </div>
        <div>
          <label class="block text-xs font-bold uppercase text-stone-500 mb-1">Descripción</label>
          <textarea id="edit-desc" rows="4" required class="w-full px-3 py-2.5 bg-stone-50 border border-stone-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"></textarea>
        </div>
        <div>
          <label class="block text-xs font-bold uppercase text-stone-500 mb-1">Foto del anuncio (opcional)</label>
          <input type="file" id="edit-photo" accept="image/*" class="w-full text-sm text-stone-600">
          <img id="edit-photo-preview" class="hidden mt-2 w-full h-32 object-cover rounded-xl border border-stone-200">
        </div>
        <div class="flex gap-2 pt-1">
          <button type="button" onclick="closeEditModal()" class="flex-1 py-2.5 bg-stone-100 hover:bg-stone-200 text-stone-700 font-semibold text-sm rounded-xl">Cancelar</button>
          <button type="submit" class="flex-1 py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-bold text-sm rounded-xl">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <footer class="bg-brand-900 text-brand-100 text-xs text-center py-5 mt-auto">
    Roda Trabajo © 2026 · <a href="mailto:info@rodatrabajo.com" class="underline">info@rodatrabajo.com</a>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://ctkiiimazwpztekwfnrn.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_xkq1LHED5KxRpR35NRciCw_Na00Hi87';
    let cliente;

    function getClient() {
      if (!cliente) cliente = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      return cliente;
    }

    async function ensureProfile(session) {
      const sb = getClient();
      const meta = session.user.user_metadata || {};
      const { data: existing } = await sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
      if (!existing) {
        await sb.from('profiles').insert([{
          id: session.user.id,
          full_name: meta.full_name || '',
          avatar_url: meta.avatar_url || null,
          phone: meta.phone || null,
          user_role: meta.user_role === 'profesional' ? 'empresa' : 'particular'
        }]);
      }
      return existing;
    }

    async function loadMessages() {
      const sb = getClient();
      const { data: { session } } = await sb.auth.getSession();
      const cont = document.getElementById('messages-container');
      const badge = document.getElementById('msg-count');

      if (!session) {
        cont.innerHTML = '';
        return;
      }

      const { data: msgs, error } = await sb
        .from('messages')
        .select('*')
        .eq('owner_id', session.user.id)
        .order('created_at', { ascending: false });

      if (error) {
        cont.innerHTML = '<p class="text-sm text-red-600">Error al cargar mensajes.</p>';
        return;
      }

      if (!msgs || msgs.length === 0) {
        cont.innerHTML = '<div class="bg-white p-5 rounded-xl border border-stone-200 text-center text-sm text-stone-500">Aún no tienes mensajes.</div>';
        badge.classList.add('hidden');
        return;
      }

      const unread = msgs.filter(m => !m.read).length;
      if (unread > 0) {
        badge.textContent = unread;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }

      cont.innerHTML = msgs.map(m => `
        <div class="bg-white p-4 rounded-xl border ${m.read ? 'border-stone-200' : 'border-brand-300 bg-brand-50/40'} shadow-sm space-y-2">
          <div class="flex flex-wrap items-start justify-between gap-2">
            <div>
              <p class="font-bold text-brand-900 text-sm">${m.sender_name || 'Interesado'}</p>
              <p class="text-xs text-stone-500">Sobre: <span class="font-semibold">${m.ad_title || 'Anuncio'}</span></p>
            </div>
            <span class="text-xs text-stone-400">${m.created_at ? new Date(m.created_at).toLocaleString('es-ES') : ''}</span>
          </div>
          <p class="text-sm text-stone-700 whitespace-pre-line">${m.body || ''}</p>
          <div class="flex flex-wrap gap-3 text-xs text-stone-600 pt-1 border-t border-stone-100">
            ${m.sender_phone ? `<a href="tel:${m.sender_phone}" class="font-semibold text-brand-700"><i class="fa-solid fa-phone mr-1"></i>${m.sender_phone}</a>` : ''}
            ${m.sender_email ? `<a href="mailto:${m.sender_email}" class="font-semibold text-brand-700"><i class="fa-solid fa-envelope mr-1"></i>${m.sender_email}</a>` : ''}
          </div>
          <div class="flex gap-2 pt-1">
            ${!m.read ? `<button onclick="markRead('${m.id}')" class="px-3 py-1.5 bg-brand-600 hover:bg-brand-700 text-white text-xs font-bold rounded-lg">Marcar leído</button>` : '<span class="text-xs text-stone-400">Leído</span>'}
          </div>
        </div>
      `).join('');
    }

    async function markRead(id) {
      const sb = getClient();
      await sb.from('messages').update({ read: true }).eq('id', id);
      loadMessages();
    }

    async function loadUserAds() {
      const sb = getClient();
      const { data: { session } } = await sb.auth.getSession();
      const container = document.getElementById('user-ads-container');

      if (!session) {
        container.innerHTML = `
          <div class="bg-white p-8 rounded-2xl border border-stone-200 text-center space-y-3">
            <p class="text-stone-600 text-sm">Debes iniciar sesión.</p>
            <a href="login.html" class="inline-block px-5 py-2.5 bg-brand-600 text-white font-bold text-sm rounded-xl">Iniciar sesión</a>
          </div>`;
        return;
      }

      const userEmail = session.user.email;
      const userId = session.user.id;
      const meta = session.user.user_metadata || {};

      await ensureProfile(session);

      const { data: perfil } = await sb.from('profiles').select('*').eq('id', userId).maybeSingle();
      const nombre = (perfil && perfil.full_name) || meta.full_name || '';
      const avatar = (perfil && perfil.avatar_url) || meta.avatar_url || '';
      const rol = (perfil && perfil.user_role) || meta.user_role || 'particular';

      document.getElementById('user-avatar-img').src =
        avatar || `https://ui-avatars.com/api/?name=${encodeURIComponent(nombre || userEmail)}&background=6B4423&color=fff`;
      document.getElementById('profile-name').value = nombre;
      document.getElementById('user-email-title').textContent = userEmail;
      document.getElementById('profile-tag').textContent =
        (rol === 'empresa' || rol === 'profesional') ? 'Empresa / Profesional' : 'Particular';

      const { data: ads, error } = await sb
        .from('ads')
        .select('*')
        .or(`user_id.eq.${userId},contact_info.eq.${userEmail},email.eq.${userEmail}`)
        .order('created_at', { ascending: false });

      if (error || !ads || ads.length === 0) {
        container.innerHTML = `
          <div class="bg-white p-8 rounded-2xl border border-stone-200 text-center space-y-3">
            <p class="text-stone-600 text-sm">Aún no tienes anuncios publicados.</p>
            <a href="publicar.html" class="inline-block px-5 py-2.5 bg-brand-600 text-white font-bold text-sm rounded-xl">Publicar anuncio gratis</a>
          </div>`;
        return;
      }

      container.innerHTML = ads.map(ad => {
        const titulo = ad.title || ad.titulo || ad.profession || 'Anuncio';
        const ciudad = ad.city || ad.provincia || ad.municipio || 'España';
        const estado = ad.status || 'pending';
        const foto = ad.image_url || ad.photo_url || '';
        const estadoColor = estado === 'approved' ? 'bg-green-100 text-green-800' :
                            estado === 'rejected' ? 'bg-red-100 text-red-800' : 'bg-amber-100 text-amber-800';
        const estadoTxt = estado === 'approved' ? 'Aprobado' : estado === 'rejected' ? 'Rechazado' : 'Pendiente';

        return `
        <div class="bg-white p-4 rounded-xl border border-stone-200 shadow-sm flex flex-col sm:flex-row gap-4">
          ${foto ? `<img src="${foto}" class="w-full sm:w-24 h-24 object-cover rounded-lg border border-stone-100 shrink-0" alt="">` : `
          <div class="w-full sm:w-24 h-24 bg-stone-100 rounded-lg flex items-center justify-center text-stone-400 shrink-0"><i class="fa-solid fa-image text-xl"></i></div>`}
          <div class="flex-1 min-w-0 space-y-1">
            <div class="flex flex-wrap items-center gap-2">
              <span class="px-2 py-0.5 rounded text-xs font-bold ${estadoColor}">${estadoTxt}</span>
              <span class="text-xs text-stone-400">${ad.created_at ? new Date(ad.created_at).toLocaleDateString('es-ES') : ''}</span>
            </div>
            <h3 class="font-bold text-brand-900 truncate">${titulo}</h3>
            <p class="text-xs text-stone-500"><i class="fa-solid fa-location-dot mr-1"></i>${ciudad}</p>
            <p class="text-sm text-stone-600 line-clamp-2">${ad.description || ad.descripcion || ''}</p>
          </div>
          <div class="flex sm:flex-col gap-2 shrink-0">
            <button onclick="renewAd('${ad.id}')" class="px-3 py-1.5 bg-stone-100 hover:bg-stone-200 text-stone-700 font-semibold text-xs rounded-lg">
              <i class="fa-solid fa-rotate mr-1"></i>Renovar
            </button>
            <button onclick='openEditModal(${JSON.stringify({ id: ad.id, title: titulo, city: ciudad, desc: ad.description || ad.descripcion || "", photo: foto })})' class="px-3 py-1.5 bg-brand-100 hover:bg-brand-200 text-brand-800 font-semibold text-xs rounded-lg">
              <i class="fa-solid fa-pen mr-1"></i>Editar
            </button>
            <button onclick="deleteAd('${ad.id}')" class="px-3 py-1.5 bg-red-50 hover:bg-red-100 text-red-700 font-semibold text-xs rounded-lg">
              <i class="fa-solid fa-trash-can mr-1"></i>Eliminar
            </button>
          </div>
        </div>`;
      }).join('');
    }

    async function saveProfileName() {
      const sb = getClient();
      const { data: { session } } = await sb.auth.getSession();
      if (!session) return;
      const name = document.getElementById('profile-name').value.trim();
      if (!name) { alert('Escribe un nombre'); return; }

      const { error } = await sb.from('profiles').upsert({
        id: session.user.id,
        full_name: name,
        updated_at: new Date().toISOString()
      });
      if (error) alert('Error: ' + error.message);
      else {
        await sb.auth.updateUser({ data: { full_name: name } });
        alert('Nombre guardado. Se verá en tus anuncios.');
      }
    }

    async function uploadAvatar(e) {
      const file = e.target.files[0];
      if (!file) return;
      const sb = getClient();
      const { data: { session } } = await sb.auth.getSession();
      if (!session) return;

      const ext = file.name.split('.').pop();
      const path = `${session.user.id}.${ext}`;
      const { error } = await sb.storage.from('avatars').upload(path, file, { upsert: true });
      if (error) {
        alert('No se pudo subir la foto: ' + error.message);
        return;
      }
      const { data } = sb.storage.from('avatars').getPublicUrl(path);
      const url = data.publicUrl;

      await sb.from('profiles').upsert({
        id: session.user.id,
        avatar_url: url,
        updated_at: new Date().toISOString()
      });
      await sb.auth.updateUser({ data: { avatar_url: url } });

      document.getElementById('user-avatar-img').src = url + '?t=' + Date.now();
      alert('Foto de perfil guardada. Se verá en Ver oferta.');
    }

    async function renewAd(id) {
      const sb = getClient();
      const { error } = await sb.from('ads').update({ created_at: new Date().toISOString() }).eq('id', id);
      if (error) alert('Error: ' + error.message);
      else { alert('Anuncio renovado'); loadUserAds(); }
    }

    async function deleteAd(id) {
      if (!confirm('¿Eliminar este anuncio?')) return;
      const sb = getClient();
      const { error } = await sb.from('ads').delete().eq('id', id);
      if (error) alert('Error: ' + error.message);
      else loadUserAds();
    }

    function openEditModal(ad) {
      document.getElementById('edit-id').value = ad.id;
      document.getElementById('edit-title').value = ad.title || '';
      document.getElementById('edit-city').value = ad.city || '';
      document.getElementById('edit-desc').value = ad.desc || '';
      const prev = document.getElementById('edit-photo-preview');
      if (ad.photo) {
        prev.src = ad.photo;
        prev.classList.remove('hidden');
      } else {
        prev.classList.add('hidden');
      }
      document.getElementById('edit-photo').value = '';
      document.getElementById('edit-modal').classList.remove('hidden');
    }

    function closeEditModal() {
      document.getElementById('edit-modal').classList.add('hidden');
    }

    document.getElementById('edit-photo').addEventListener('change', (e) => {
      const file = e.target.files[0];
      const prev = document.getElementById('edit-photo-preview');
      if (file) {
        prev.src = URL.createObjectURL(file);
        prev.classList.remove('hidden');
      }
    });

    document.getElementById('edit-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const sb = getClient();
      const id = document.getElementById('edit-id').value;
      const title = document.getElementById('edit-title').value.trim();
      const city = document.getElementById('edit-city').value.trim();
      const description = document.getElementById('edit-desc').value.trim();
      const photoInput = document.getElementById('edit-photo');

      let image_url = null;
      if (photoInput.files && photoInput.files[0]) {
        const file = photoInput.files[0];
        const ext = file.name.split('.').pop();
        const path = `ads/${id}_${Date.now()}.${ext}`;
        const { error: upErr } = await sb.storage.from('ads').upload(path, file, { upsert: true });
        if (!upErr) {
          const { data } = sb.storage.from('ads').getPublicUrl(path);
          image_url = data.publicUrl;
        }
      }

      const payload = { title, city, description, titulo: title, descripcion: description };
      if (image_url) { payload.image_url = image_url; payload.photo_url = image_url; }

      const { error } = await sb.from('ads').update(payload).eq('id', id);
      if (error) alert('Error: ' + error.message);
      else {
        closeEditModal();
        loadUserAds();
      }
    });

    async function logoutUser() {
      await getClient().auth.signOut();
      window.location.href = 'login.html';
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadUserAds();
      loadMessages();
    });
  </script>
</body>
</html>
