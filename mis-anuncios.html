<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Anuncios - Roda Trabajo</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
          colors: { brand: { 50: '#f0fdf4', 100: '#dcfce7', 500: '#22c55e', 600: '#16a34a', 700: '#15803d' } }
        }
      }
    }
  </script>
  <style>
    .glass-nav { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col justify-between">

  <!-- HEADER MODERNO CON BANDERA DE ESPAÑA -->
  <header class="sticky top-0 z-40 glass-nav border-b border-slate-200/85">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2.5">
        <div class="w-10 h-10 rounded-xl overflow-hidden shadow-md shadow-brand-500/20 flex flex-col border border-slate-200">
          <div class="h-1/4 bg-red-600 w-full"></div>
          <div class="h-2/4 bg-yellow-500 w-full"></div>
          <div class="h-1/4 bg-red-600 w-full"></div>
        </div>
        <span class="text-xl font-black tracking-tight text-slate-900">RODA TRABAJO</span>
      </a>
      <ul class="flex items-center gap-4 list-none m-0 p-0">
        <li><a href="index.html" class="text-sm font-semibold text-slate-600 hover:text-brand-600 transition-colors">Inicio</a></li>
        <li><a href="publicar.html" class="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white text-sm font-bold rounded-xl shadow-md transition-all">Publicar anuncio</a></li>
        <li><a href="#" onclick="logoutUser()" class="text-sm font-semibold text-slate-600 hover:text-red-600 transition-colors">Cerrar sesión</a></li>
      </ul>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="max-w-4xl mx-auto px-4 py-10 w-full flex-1 space-y-8">
    
    <!-- CABECERA DEL PERFIL -->
    <div class="bg-white p-6 sm:p-8 rounded-3xl shadow-xl border border-slate-200/80 flex flex-col sm:flex-row items-center gap-6">
      <img id="user-avatar-img" class="w-20 h-20 rounded-2xl object-cover bg-slate-100 border-2 border-brand-500 shadow-md" src="" alt="Avatar">
      <div class="text-center sm:text-left space-y-1">
        <h1 class="text-xl font-black text-slate-900" id="user-email-title">Mi Panel</h1>
        <div id="profile-tag" class="inline-block px-3 py-1 bg-brand-100 text-brand-700 text-xs font-bold rounded-full">Perfil de Usuario</div>
      </div>
    </div>

    <!-- LISTADO DE ANUNCIOS -->
    <div class="space-y-4">
      <h2 class="text-2xl font-black text-slate-900">Tus anuncios publicados</h2>
      <div id="user-ads-container" class="space-y-4">
        <p class="text-slate-500 text-sm">Cargando tus anuncios...</p>
      </div>
    </div>

  </main>

  <!-- MODAL DE EDICIÓN -->
  <div id="edit-modal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white p-6 sm:p-8 rounded-3xl shadow-2xl w-full max-w-lg border border-slate-200 space-y-6">
      <div class="flex justify-between items-center border-b border-slate-100 pb-4">
        <h2 class="text-lg font-black text-slate-900">Modificar anuncio</h2>
        <button onclick="closeEditModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <form id="edit-form" class="space-y-4">
        <input type="hidden" id="edit-id">
        <div class="space-y-1">
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-600">Título / Profesión</label>
          <input type="text" id="edit-title" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand-500">
        </div>
        <div class="space-y-1">
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-600">Ubicación (Ciudad o Provincia)</label>
          <input type="text" id="edit-city" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand-500">
        </div>
        <div class="space-y-1">
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-600">Descripción</label>
          <textarea id="edit-desc" rows="4" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand-500"></textarea>
        </div>
        <div class="flex justify-end gap-3 pt-2">
          <button type="button" onclick="closeEditModal()" class="px-5 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-sm rounded-xl transition-all">Cancelar</button>
          <button type="submit" class="px-5 py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-bold text-sm rounded-xl shadow-md transition-all">Guardar cambios</button>
        </div>
      </form>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="bg-slate-900 text-slate-400 text-sm border-t border-slate-800 py-6 text-center mt-12">
    <p>© 2026 Roda Trabajo. Todos los derechos reservados.</p>
  </footer>

  <!-- SUPABASE & SCRIPT DE LÓGICA -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://ctkiiimazwpztekwfnrn.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_xkq1LHED5KxRpR35NRciCw_Na00Hi87';

    async function loadUserAds() {
      const cliente = window.supabaseClient || window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const { data: { session } } = await cliente.auth.getSession();
      const container = document.getElementById('user-ads-container');

      if (!session) {
        container.innerHTML = `
          <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 text-center space-y-4">
            <p class="text-slate-600 text-sm">Debes iniciar sesión para ver tus anuncios.</p>
            <a href="login.html" class="inline-block px-6 py-3 bg-brand-600 text-white font-bold text-sm rounded-xl shadow-md hover:bg-brand-700 transition-all">Iniciar sesión</a>
          </div>
        `;
        return;
      }

      const userEmail = session.user.email;
      const userId = session.user.id;
      const metadata = session.user.user_metadata || {};
      
      // Avatar y datos visuales
      document.getElementById('user-avatar-img').src = metadata.avatar_url || `https://ui-avatars.com/api/?name=${encodeURIComponent(userEmail)}&background=22c55e&color=fff`;
      document.getElementById('user-email-title').innerText = userEmail;

      // BÚSQUEDA INTELIGENTE MULTICAMPOS (user_id, contact_info, email)
      const { data: ads, error } = await cliente
        .from('ads')
        .select('*')
        .or(`user_id.eq.${userId},contact_info.eq.${userEmail},email.eq.${userEmail}`)
        .order('created_at', { ascending: false });

      if (error || !ads || ads.length === 0) {
        container.innerHTML = `
          <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 text-center space-y-4">
            <p class="text-slate-600 text-sm">No tienes anuncios publicados aún con el correo <strong>(${userEmail})</strong>.</p>
            <a href="publicar.html" class="inline-block px-6 py-3 bg-brand-600 text-white font-bold text-sm rounded-xl shadow-md hover:bg-brand-700 transition-all">Publicar anuncio gratis</a>
          </div>
        `;
        return;
      }

      container.innerHTML = ads.map(ad => `
        <div class="bg-white p-6 rounded-2xl shadow-md border border-slate-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
          <div class="space-y-1">
            <h3 class="font-bold text-lg text-slate-900">${ad.title || ad.profession || 'Anuncio'}</h3>
            <div class="text-xs text-slate-500 flex items-center gap-2">
              <span class="px-2.5 py-0.5 bg-slate-100 rounded-md font-semibold text-slate-700 uppercase">Estado: ${ad.status || 'pendiente'}</span>
              <span>•</span>
              <span>📍 ${ad.city || ad.province || 'España'}</span>
            </div>
            <p class="text-sm text-slate-600 line-clamp-2 mt-2">${ad.description || ad.descripcion || ''}</p>
          </div>
          <div class="flex items-center gap-2 w-full sm:w-auto justify-end flex-wrap">
            <button onclick="renewAd('${ad.id}')" class="px-3.5 py-2 bg-blue-50 hover:bg-blue-100 text-blue-600 font-bold text-xs rounded-xl transition-all border border-blue-200 cursor-pointer">
              <i class="fa-solid fa-rotate mr-1"></i> Renovar
            </button>
            <button onclick="openEditModal('${ad.id}', '${escapeHtml(ad.title || ad.profession || '')}', '${escapeHtml(ad.city || '')}', '${escapeHtml(ad.description || ad.descripcion || '')}')" class="px-3.5 py-2 bg-amber-50 hover:bg-amber-100 text-amber-600 font-bold text-xs rounded-xl transition-all border border-amber-200 cursor-pointer">
              <i class="fa-solid fa-pen mr-1"></i> Modificar
            </button>
            <button onclick="deleteAd('${ad.id}')" class="px-3.5 py-2 bg-red-50 hover:bg-red-100 text-red-600 font-bold text-xs rounded-xl transition-all border border-red-200 cursor-pointer">
              <i class="fa-solid fa-trash-can mr-1"></i> Eliminar
            </button>
          </div>
        </div>
      `).join('');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    async function renewAd(id) {
      const cliente = window.supabaseClient || window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const { error } = await cliente.from('ads').update({ created_at: new Date().toISOString() }).eq('id', id);
      if (error) alert('Error al renovar: ' + error.message);
      else {
        alert('¡Anuncio renovado con éxito!');
        loadUserAds();
      }
    }

    async function deleteAd(id) {
      if (!confirm('¿Seguro que deseas borrar este anuncio?')) return;
      const cliente = window.supabaseClient || window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const { error } = await cliente.from('ads').delete().eq('id', id);
      if (error) alert('Error al borrar: ' + error.message);
      else loadUserAds();
    }

    function openEditModal(id, title, city, desc) {
      document.getElementById('edit-id').value = id;
      document.getElementById('edit-title').value = title;
      document.getElementById('edit-city').value = city;
      document.getElementById('edit-desc').value = desc;
      document.getElementById('edit-modal').style.display = 'flex';
    }

    function closeEditModal() {
      document.getElementById('edit-modal').style.display = 'none';
    }

    document.getElementById('edit-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('edit-id').value;
      const title = document.getElementById('edit-title').value;
      const city = document.getElementById('edit-city').value;
      const description = document.getElementById('edit-desc').value;

      const cliente = window.supabaseClient || window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const { error } = await cliente.from('ads').update({ title, profession: title, city, description }).eq('id', id);

      if (error) {
        alert('Error al guardar los cambios: ' + error.message);
      } else {
        alert('¡Anuncio modificado correctamente!');
        closeEditModal();
        loadUserAds();
      }
    });

    async function logoutUser() {
      const cliente = window.supabaseClient || window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      await cliente.auth.signOut();
      window.location.href = 'login.html';
    }

    document.addEventListener('DOMContentLoaded', loadUserAds);
  </script>
</body>
</html>
