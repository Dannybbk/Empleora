<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis anuncios - Roda Trabajo</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
          colors: { brand: { 50: '#f0fdf4', 100: '#dcfce7', 500: '#22c55e', 600: '#16a34a', 700: '#15803d' } }
        }
      }
    }
  </script>
  <style>
    .glass-nav { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col justify-between">

  <!-- HEADER MODERNO CON BANDERA DE ESPAÑA -->
  <header class="sticky top-0 z-40 glass-nav border-b border-slate-200/85">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2.5">
        <div class="w-10 h-10 rounded-xl overflow-hidden shadow-md shadow-brand-500/20 flex flex-col border border-slate-200">
          <div class="h-1/4 bg-red-600 w-full"></div>
          <div class="h-2/4 bg-yellow-500 w-full"></div>
          <div class="h-1/4 bg-red-600 w-full"></div>
        </div>
        <span class="text-xl font-black tracking-tight text-slate-900">RODA TRABAJO</span>
      </a>
      <div class="flex items-center gap-4">
        <a href="publicar.html" class="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white text-sm font-bold rounded-xl shadow-md transition-all">Publicar nuevo</a>
        <a href="#" id="logout" class="text-sm font-semibold text-slate-600 hover:text-red-600 transition-colors">Cerrar sesión</a>
      </div>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="max-w-4xl mx-auto px-4 py-10 w-full flex-1 space-y-8">
    
    <!-- PERFIL INFO -->
    <div class="bg-white p-6 sm:p-8 rounded-3xl shadow-xl border border-slate-200/80 flex flex-col sm:flex-row items-center gap-6">
      <div id="user-avatar" class="w-20 h-20 bg-brand-600 text-white font-black text-2xl rounded-2xl flex items-center justify-center shadow-lg shadow-brand-500/30 overflow-hidden">
        U
      </div>
      <div class="text-center sm:text-left space-y-1">
        <h2 id="user-email" class="text-lg sm:text-xl font-bold text-slate-900">Cargando usuario...</h2>
        <span class="inline-block px-3 py-1 bg-brand-100 text-brand-700 text-xs font-bold rounded-full">Perfil Verificado</span>
      </div>
    </div>

    <!-- MIS ANUNCIOS -->
    <div class="space-y-4">
      <h1 class="text-2xl font-black text-slate-900">Mis anuncios publicados</h1>
      <div id="my-ads" class="grid grid-cols-1 gap-4">
        <p class="text-slate-500 text-sm">Buscando tus anuncios...</p>
      </div>
    </div>

  </main>

  <!-- FOOTER -->
  <footer class="bg-slate-900 text-slate-400 text-sm border-t border-slate-800 py-6 text-center">
    <p>© 2026 Roda Trabajo. Todos los derechos reservados.</p>
  </footer>

  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://ctkiiimazwpztekwfnrn.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_xkq1LHED5KxRpR35NRciCw_Na00Hi87';
    const cliente = window.supabaseClient || window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadMyAds() {
      const { data: { session } } = await cliente.auth.getSession();
      if (!session) {
        window.location.href = 'login.html';
        return;
      }

      const userEmail = session.user.email;
      const userId = session.user.id;

      // 1. Cargar los datos del perfil (Nombre, foto, rol) desde la tabla 'profiles'
      let displayName = userEmail;
      let displayRole = 'Perfil Verificado';
      let avatarHtml = userEmail.substring(0, 2).toUpperCase();

      const { data: perfil } = await cliente
        .from('profiles')
        .select('full_name, role, avatar_url')
        .eq('id', userId)
        .single();

      if (perfil) {
        if (perfil.full_name) displayName = perfil.full_name;
        if (perfil.role) displayRole = perfil.role;
        if (perfil.avatar_url) {
          avatarHtml = `<img src="${perfil.avatar_url}" alt="Avatar" class="w-full h-full object-cover">`;
        }
      }

      // Mostrar datos del usuario en pantalla
      document.getElementById('user-email').textContent = displayName;
      
      const avatarContainer = document.getElementById('user-avatar');
      avatarContainer.innerHTML = avatarHtml;
      if (perfil?.avatar_url) {
        avatarContainer.classList.remove('bg-brand-600', 'text-white', 'font-black', 'text-2xl', 'items-center', 'justify-center');
      }

      // 2. Búsqueda inteligente de anuncios del usuario
      const { data, error } = await cliente
        .from('ads')
        .select('*')
        .or(`user_id.eq.${userId},contact_info.eq.${userEmail}`)
        .order('created_at', { ascending: false });

      const container = document.getElementById('my-ads');

      if (error || !data || data.length === 0) {
        container.innerHTML = `
          <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 text-center space-y-4">
            <p class="text-slate-600 text-sm">No tienes anuncios publicados aún con este usuario.</p>
            <a href="publicar.html" class="inline-block px-6 py-3 bg-brand-600 text-white font-bold text-sm rounded-xl shadow-md hover:bg-brand-700 transition-all">Publicar anuncio gratis</a>
          </div>`;
        return;
      }

      container.innerHTML = data.map(ad => `
        <div class="bg-white p-6 rounded-2xl shadow-md border border-slate-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
          <div class="space-y-1">
            <h3 class="font-bold text-lg text-slate-900">${ad.title || ad.titulo || 'Sin título'}</h3>
            <div class="text-xs text-slate-500 flex items-center gap-2">
              <span class="px-2 py-0.5 bg-slate-100 rounded-md font-semibold text-slate-700 uppercase">Estado: ${ad.status || 'pendiente'}</span>
              <span>•</span>
              <span>📍 ${ad.city || ad.province || 'España'}</span>
            </div>
            <p class="text-sm text-slate-600 line-clamp-2 mt-2">${ad.description || ad.descripcion || ''}</p>
          </div>
          <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
            <!-- Botón para ver el detalle del anuncio -->
            <a href="anuncio.html?id=${ad.id}" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs rounded-xl transition-all border border-slate-200 text-center">
              Ver detalle
            </a>
            <button onclick="deleteAd('${ad.id}')" class="px-4 py-2 bg-red-50 hover:bg-red-100 text-red-600 font-bold text-xs rounded-xl transition-all border border-red-200 cursor-pointer">
              <i class="fa-solid fa-trash-can mr-1"></i> Eliminar
            </button>
          </div>
        </div>
      `).join('');
    }

    async function deleteAd(id) {
      if (!confirm('¿Estás seguro de que deseas eliminar este anuncio?')) return;
      const { error } = await cliente.from('ads').delete().eq('id', id);
      if (error) {
        alert('Error al eliminar: ' + error.message);
      } else {
        loadMyAds();
      }
    }

    document.getElementById('logout').addEventListener('click', async (e) => {
      e.preventDefault();
      await cliente.auth.signOut();
      window.location.href = 'index.html';
    });

    loadMyAds();
  </script>
</body>
</html>
