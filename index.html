
<script>
document.addEventListener('DOMContentLoaded', function () {
  // Registro desde el menú hamburguesa
  const registroMovil = document.getElementById('btn-registro-mobile');
  if (registroMovil) {
    registroMovil.href = 'registro.html';
  }

  // Todos los enlaces para publicar anuncios
  document.querySelectorAll('a').forEach(function (enlace) {
    const texto = enlace.textContent.toLowerCase().trim();

    if (
      texto.includes('publicar anuncio') ||
      texto.includes('publicar tu anuncio gratis')
    ) {
      enlace.href = 'registro.html';
    }
  });

  // El inicio de sesión continúa en login.html
  const loginMovil = document.getElementById('btn-login-mobile');
  const loginEscritorio = document.getElementById('btn-login-desktop');

  if (loginMovil && loginMovil.textContent.toLowerCase().includes('iniciar')) {
    loginMovil.href = 'login.html';
  }

  if (loginEscritorio && loginEscritorio.textContent.toLowerCase().includes('iniciar')) {
    loginEscritorio.href = 'login.html';
  }

  // Menú hamburguesa
  const boton = document.getElementById('mobile-menu-btn');
  const menu = document.getElementById('mobile-menu');

  if (boton && menu) {
    boton.addEventListener('click', function () {
      menu.classList.toggle('hidden');
      boton.setAttribute(
        'aria-expanded',
        String(!menu.classList.contains('hidden'))
      );
    });
  }
});
</script>
</body>
</html>
