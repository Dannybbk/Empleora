  <section id="anuncios" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="flex justify-between items-end mb-6">
      <div>
        <h2 class="text-2xl sm:text-3xl font-bold text-slate-900">Últimos anuncios publicados</h2>
        <p class="text-slate-500 text-sm mt-1">Ofertas destacadas agregadas recientemente</p>
      </div>
    </div>
    <div id="contenedor-anuncios" class="space-y-4">
      <div class="text-center py-8 text-slate-500">
        <i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i>
        <p>Cargando ofertas de empleo...</p>
      </div>
    </div>
  </section>

  <footer class="bg-slate-900 text-slate-400 text-sm mt-16 border-t border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex flex-col sm:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-2">
        <div class="w-6 h-6 rounded-md overflow-hidden flex flex-col border border-slate-700">
          <div class="h-1/4 bg-red-600 w-full"></div>
          <div class="h-2/4 bg-yellow-500 w-full"></div>
          <div class="h-1/4 bg-red-600 w-full"></div>
        </div>
        <span class="font-bold text-white tracking-wide">RODA TRABAJO</span>
        <span class="text-xs text-slate-500">© 2026. Todos los derechos reservados.</span>
      </div>
      <div class="flex gap-6">
        <a href="#" class="hover:text-white transition-colors">Aviso Legal</a>
        <a href="#" class="hover:text-white transition-colors">Privacidad</a>
        <a href="#" class="hover:text-white transition-colors">Contacto</a>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://ctkiiimazwpztekwfnrn.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_xkq1LHED5KxRpR35NRciCw_Na00Hi87';
    const cliente = window.supabaseClient || window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function checkAuthAndRedirect(e) {
      e.preventDefault();
      const { data: { session } } = await cliente.auth.getSession();
      if (!session) {
        window.location.href = 'login.html';
      } else {
        window.location.href = 'publicar.html';
      }
    }

    async function cargarAnuncios() {
      const contenedor = document.getElementById('contenedor-anuncios');
      try {
        const { data: anuncios, error } = await cliente.from('ads').select('*').order('created_at', { ascending: false });
        if (error) throw error;
        if (!anuncios || anuncios.length === 0) {
          contenedor.innerHTML = '<p class="text-center text-slate-500 py-8">No hay anuncios publicados en este momento.</p>';
          return;
        }
        contenedor.innerHTML = '';
        anuncios.forEach(ad => {
          if (ad.status && ad.status !== 'approved') return;
          const card = document.createElement('div');
          card.className = "p-5 bg-white rounded-2xl border border-slate-200/80 hover:shadow-md transition-all flex flex-col md:flex-row md:items-center justify-between gap-4";
          card.setAttribute('data-provincia', ad.city || ad.provincia || '');
          card.setAttribute('data-categoria', ad.categoria || ad.category || '');
          card.setAttribute('data-municipio', ad.municipio || '');

          card.innerHTML = `
            <div class="space-y-2">
              <div class="flex items-center gap-2">
                <span class="px-2.5 py-0.5 rounded-md text-xs font-bold bg-brand-100 text-brand-800">${ad.categoria || ad.category || 'Empleo'}</span>
                <span class="text-xs text-slate-400">• ${ad.created_at ? new Date(ad.created_at).toLocaleDateString() : 'Reciente'}</span>
              </div>
              <h3 class="text-lg font-bold text-slate-900">${ad.titulo || ad.title || 'Oferta'}</h3>
              <p class="text-sm text-slate-600 flex items-center gap-4">
                <span><i class="fa-solid fa-location-dot text-slate-400"></i> ${ad.city || ad.provincia || ad.province || 'España'}</span>
                <span><i class="fa-solid fa-euro-sign text-slate-400"></i> ${ad.sueldo || ad.salario || 'A convenir'}</span>
              </p>
            </div>
            <button onclick='verDetalleAnuncio(${JSON.stringify(ad)})' class="px-4 py-2 bg-slate-100 hover:bg-brand-600 hover:text-white text-slate-700 font-semibold text-sm rounded-xl transition-colors cursor-pointer shrink-0">
              Ver oferta
            </button>
          `;
          contenedor.appendChild(card);
        });
      } catch (err) {
        console.error(err);
        contenedor.innerHTML = '<p class="text-center text-red-500 py-8">Error al cargar anuncios.</p>';
      }
    }

    function verDetalleAnuncio(ad) {
      const anterior = document.getElementById('modal-detalle-oferta');
      if (anterior) anterior.remove();

      const modal = document.createElement('div');
      modal.id = 'modal-detalle-oferta';
      modal.className = "fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm";
      
      const titulo = ad.titulo || ad.title || 'Oferta';
      modal.innerHTML = `
        <div class="bg-white rounded-3xl max-w-lg w-full p-6 sm:p-8 shadow-2xl space-y-6 relative border border-slate-100 max-h-[90vh] overflow-y-auto">
          <button onclick="document.getElementById('modal-detalle-oferta').remove()" class="absolute top-5 right-5 w-10 h-10 bg-slate-100 rounded-full flex items-center justify-center text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
          <div class="space-y-2">
            <span class="px-3 py-1 rounded-full text-xs font-bold bg-brand-100 text-brand-800 uppercase">${ad.categoria || ad.category || 'Empleo'}</span>
            <h2 class="text-2xl font-black text-slate-900">${titulo}</h2>
          </div>
          <div class="grid grid-cols-2 gap-4 bg-slate-50 p-4 rounded-2xl">
            <div><span class="block text-xs font-bold text-slate-400 uppercase">Ubicación</span><span class="text-sm font-semibold text-slate-800">${ad.city || ad.provincia || 'España'}</span></div>
            <div><span class="block text-xs font-bold text-slate-400 uppercase">Sueldo</span><span class="text-sm font-semibold text-slate-800">${ad.sueldo || ad.salario || 'A convenir'}</span></div>
          </div>
          <div class="space-y-2">
            <h4 class="font-bold text-slate-900 text-sm uppercase">Descripción</h4>
            <div class="text-slate-600 text-sm bg-slate-50/50 p-4 rounded-2xl whitespace-pre-line">${ad.descripcion || ad.description || 'Sin descripción.'}</div>
          </div>
          <div class="border-t border-slate-100 pt-4 space-y-3">
            <h4 class="font-bold text-slate-900 text-sm"><i class="fa-solid fa-paper-plane text-brand-600"></i> Contactar</h4>
            <form action="mailto:info@rodatrabajo.com" method="POST" enctype="text/plain" class="space-y-3">
              <input type="hidden" name="Anuncio" value="${titulo}">
              <input type="text" name="Nombre" required placeholder="Tu Nombre" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm">
              <div class="grid grid-cols-2 gap-3">
                <input type="tel" name="Telefono" required placeholder="Teléfono" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                <input type="email" name="Email" required placeholder="Email" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm">
              </div>
              <textarea name="Mensaje" rows="3" required placeholder="Mensaje..." class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm"></textarea>
              <div class="flex gap-2">
                <button type="submit" class="flex-1 py-3 bg-brand-600 text-white font-bold text-sm rounded-xl text-center">Enviar mensaje</button>
                <button type="button" onclick="document.getElementById('modal-detalle-oferta').remove()" class="py-3 px-5 bg-slate-100 text-slate-700 font-bold text-sm rounded-xl">Cerrar</button>
              </div>
            </form>
          </div>
        </div>
      `;
      document.body.appendChild(modal);
    }

    document.addEventListener('DOMContentLoaded', cargarAnuncios);

    const municipiosPorProvincia = {
      madrid: ["Alcobendas", "San Sebastián de los Reyes", "Pozuelo de Alarcón", "Majadahonda", "Las Rozas de Madrid", "Boadilla del Monte", "Alcorcón", "Móstoles", "Fuenlabrada", "Leganés", "Getafe", "Parla", "Pinto", "Valdemoro", "Aranjuez", "Coslada", "San Fernando de Henares", "Torrejón de Ardoz", "Alcalá de Henares", "Rivas-Vaciamadrid", "Tres Cantos", "Colmenar Viejo", "Collado Villalba"],
      toledo: ["Olías del Rey", "Bargas", "Cobisa", "Argés", "Nambroca", "Burguillos de Toledo", "Mocejón", "Magán", "Guadamur", "Polán", "Sonseca", "Torrijos", "Illescas", "Seseña", "Yuncos", "Ocaña", "Talavera de la Reina", "Consuegra"],
      barcelona: ["L'Hospitalet de Llobregat", "Badalona", "Santa Coloma de Gramenet", "Sant Adrià de Besòs", "Cornellà de Llobregat", "El Prat de Llobregat", "Esplugues de Llobregat", "Sant Just Desvern", "Sant Cugat del Vallès", "Cerdanyola del Vallès", "Sabadell", "Terrassa", "Granollers", "Mataró"],
      valencia: ["Torrent", "Paterna", "Mislata", "Burjassot", "Quart de Poblet", "Manises", "Aldaia", "Alaquàs", "Xirivella", "Catarroja", "Alfafar", "Silla", "Paiporta", "Picanya", "Moncada", "Bétera", "Sagunto"],
      sevilla: ["Dos Hermanas", "Alcalá de Guadaíra", "Mairena del Aljarafe", "Tomares", "Camas", "San Juan de Aznalfarache", "Bormujos", "La Rinconada", "Coria del Río", "Gelves", "Gines", "Espartinas", "Utrera", "Carmona"],
      zaragoza: ["Utebo", "Cuarte de Huerva", "María de Huerva", "La Puebla de Alfindén", "Villanueva de Gállego", "Zuera", "Cadrete", "La Muela", "Pinseque", "Épila", "La Almunia de Doña Godina"],
      malaga: ["Torremolinos", "Benalmádena", "Fuengirola", "Mijas", "Marbella", "Estepona", "Rincón de la Victoria", "Vélez-Málaga", "Alhaurín de la Torre", "Alhaurín el Grande", "Cártama", "Antequera"],
      murcia: ["Alcantarilla", "Molina de Segura", "Las Torres de Cotillas", "Santomera", "Beniel", "Archena", "Ceutí", "Lorquí", "Alguazas", "Cieza", "Cartagena", "San Javier"],
      palma: ["Marratxí", "Calvià", "Llucmajor", "Bunyola", "Esporles", "Valldemossa", "Andratx", "Santa María del Camí", "Algaida", "Sóller"],
      bilbao: ["Barakaldo", "Getxo", "Portugalete", "Santurtzi", "Sestao", "Basauri", "Galdakao", "Leioa", "Erandio", "Sondika", "Derio", "Durango"],
      alicante: ["San Vicente del Raspeig", "Sant Joan d'Alacant", "Mutxamel", "El Campello", "Elche", "Santa Pola", "San Juan de Alicante", "Villajoyosa", "Benidorm", "Elda", "Petrer", "Novelda"],
      cordoba: ["Almodóvar del Río", "La Carlota", "Villafranca de Córdoba", "El Carpio", "Montoro", "Palma del Río", "Posadas", "Fernán-Núñez", "Montilla", "Puente Genil"],
      valladolid: ["Laguna de Duero", "Arroyo de la Encomienda", "La Cistérniga", "Zaratán", "Simancas", "Tudela de Duero", "Cigales", "Santovenia de Pisuerga", "Cabezón de Pisuerga", "Medina del Campo"],
      vigo: ["Redondela", "Mos", "O Porriño", "Nigrán", "Baiona", "Gondomar", "Cangas", "Moaña", "Ponteareas", "Tui"],
      gijon: ["Avilés", "Villaviciosa", "Carreño", "Gozón", "Siero", "Llanera", "Corvera de Asturias", "Langreo", "Mieres"],
      granada: ["Armilla", "Maracena", "La Zubia", "Ogíjares", "Huétor Vega", "Albolote", "Atarfe", "Peligros", "Churriana de la Vega", "Las Gabias", "Santa Fe", "Cúllar Vega"],
      coruna: ["Oleiros", "Arteixo", "Culleredo", "Cambre", "Bergondo", "Sada", "Betanzos", "Carral", "Abegondo"],
      "san-sebastian": ["Pasaia", "Errenteria", "Hernani", "Astigarraga", "Lasarte-Oria", "Usurbil", "Oiartzun", "Hondarribia", "Irun", "Zarautz"],
      santander: ["Camargo", "El Astillero", "Santa Cruz de Bezana", "Piélagos", "Marina de Cudeyo", "Villaescusa", "Miengo", "Torrelavega", "Santoña", "Laredo"],
      "las-palmas": ["Telde", "Arucas", "Santa Brígida", "Teror", "Firgas", "Valsequillo", "Ingenio", "Agüimes", "Gáldar", "Santa María de Guía"]
    };

    const selectProvincia = document.getElementById('select-provincia');
    const containerMunicipio = document.getElementById('container-municipio');
    const selectMunicipio = document.getElementById('select-municipio');

    selectProvincia.addEventListener('change', (e) => {
      const provincia = e.target.value;
      if (provincia && municipiosPorProvincia[provincia]) {
        selectMunicipio.innerHTML = '<option value="">Todos los municipios y alrededores</option>';
        municipiosPorProvincia[provincia].forEach(muni => {
          const opt = document.createElement('option');
          opt.value = muni.toLowerCase().replace(/\s+/g, '-');
          opt.textContent = muni;
          selectMunicipio.appendChild(opt);
        });
        containerMunicipio.classList.remove('hidden');
      } else {
        containerMunicipio.classList.add('hidden');
      }
    });

    document.getElementById('btn-buscar').addEventListener('click', () => {
      const provinciaVal = selectProvincia.value;
      const categoriaVal = document.getElementById('select-categoria').value;
      const municipioVal = selectMunicipio.value;
      const keyword = document.getElementById('input-keyword').value.toLowerCase().trim();

      const cards = document.querySelectorAll('#contenedor-anuncios > div');
      cards.forEach(card => {
        const cardProv = card.getAttribute('data-provincia');
        const cardCat = card.getAttribute('data-categoria');
        const cardMuni = card.getAttribute('data-municipio');
        const text = card.textContent.toLowerCase();

        let matchProv = !provinciaVal || cardProv.toLowerCase().includes(provinciaVal);
        let matchCat = !categoriaVal || cardCat.toLowerCase().includes(categoriaVal.toLowerCase());
        let matchMuni = !municipioVal || cardMuni === municipioVal;
        let matchKw = !keyword || text.includes(keyword);

        if (matchProv && matchCat && matchMuni && matchKw) {
          card.classList.remove('hidden');
        } else {
          card.classList.add('hidden');
        }
      });
      document.getElementById('anuncios').scrollIntoView({ behavior: 'smooth' });
    });

    const btnMobile = document.getElementById('mobile-menu-btn');
    const menuMobile = document.getElementById('mobile-menu');
    btnMobile.addEventListener('click', () => { menuMobile.classList.toggle('hidden'); });
  </script>
</body>
</html>
