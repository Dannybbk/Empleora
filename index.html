  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const container = document.getElementById('ads-container');
      
      // Cliente blindado para evitar errores
      const cliente = window.supabaseClient || window.supabase.createClient('https://ctkiiimazwpztekwfnrn.supabase.co', 'sb_publishable_xkq1LHED5KxRpR35NRciCw_Na00Hi87');

      if (!container) return;

      const { data: ads, error } = await cliente
        .from('ads')
        .select('*');

      if (error) {
        console.error('Error al obtener anuncios:', error);
        container.innerHTML = '<p>No se pudieron cargar los anuncios.</p>';
        return;
      }

      if (!ads || ads.length === 0) {
        container.innerHTML = '<p>No hay anuncios disponibles en este momento.</p>';
        return;
      }

      container.innerHTML = ads.map(ad => `
        <div class="ad-card" style="background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:20px; text-align:left;">
          <h3 style="margin-bottom:8px; color:#1e293b;">${ad.title || ad.profession || 'Anuncio'}</h3>
          <div class="ad-meta" style="color:#64748b; font-size:14px; margin-bottom:12px;">
            ${ad.category || 'General'} • ${ad.city || ad.province || 'España'}
          </div>
          <p class="ad-desc" style="color:#334155; margin-bottom:16px;">${ad.experience || ad.skills || ad.description || 'Sin descripción adicional'}</p>
          <a href="anuncio.html?id=${ad.id}" class="btn btn-outline">Ver anuncio</a>
        </div>
      `).join('');
    });
  </script>
