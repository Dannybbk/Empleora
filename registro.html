<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Roda Trabajo</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --brand-900: #1a1a1a;
      --brand-800: #3A2414;
      --brand-600: #6B4423;
      --brand-500: #8B5E3C;
      --brand-100: #f0e6d8;
      --muted: #78716c;
      --border: #e7e5e4;
      --bg: #fafaf9;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: #1c1917;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #fff;
      border-bottom: 1px solid var(--border);
    }
    .nav {
      max-width: 1100px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--brand-900);
      font-weight: 800;
      font-size: 18px;
    }
    .logo-mark {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: var(--brand-900);
      color: var(--brand-100);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 900;
    }
    .back {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      text-decoration: none;
    }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }
    .box {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.04);
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      text-align: center;
      color: var(--brand-900);
      margin-bottom: 6px;
    }
    .sub {
      text-align: center;
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 22px;
    }
    .form-group { margin-bottom: 14px; }
    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
      color: var(--brand-900);
    }
    input, select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      background: #fafaf9;
    }
    input:focus, select:focus {
      outline: none;
      border-color: var(--brand-500);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(139, 94, 60, 0.12);
    }
    .btn {
      width: 100%;
      padding: 13px;
      background: var(--brand-600);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      margin-top: 6px;
    }
    .btn:hover { background: var(--brand-800); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .toggle {
      text-align: center;
      margin-top: 18px;
      font-size: 14px;
      color: var(--muted);
    }
    .toggle a {
      color: var(--brand-600);
      font-weight: 700;
      text-decoration: none;
    }
    #message {
      text-align: center;
      margin-top: 14px;
      font-size: 13px;
      font-weight: 500;
      word-break: break-all;
    }
    footer {
      background: var(--brand-900);
      color: #a8a29e;
      font-size: 13px;
      text-align: center;
      padding: 20px;
    }
    footer a { color: #e7e5e4; }
  </style>
</head>
<body>

  <header>
    <div class="nav">
      <a href="index.html" class="logo">
        <div class="logo-mark">RT</div>
        <span>Roda Trabajo</span>
      </a>
      <a href="index.html" class="back"><i class="fa-solid fa-arrow-left"></i> Inicio</a>
    </div>
  </header>

  <main>
    <div class="box">
      <h1>Crear cuenta gratis</h1>
      <p class="sub">Publica o busca anuncios en Roda Trabajo</p>

      <form id="register-form">
        <div class="form-group">
          <label>Tipo de perfil</label>
          <select id="reg-role" name="role" required>
            <option value="particular">Particular</option>
            <option value="profesional">Profesional</option>
          </select>
        </div>
        <div class="form-group">
          <label>Nombre</label>
          <input type="text" id="reg-name" name="name" placeholder="Tu nombre o empresa" required>
        </div>
        <div class="form-group">
          <label>Teléfono</label>
          <input type="tel" id="reg-phone" name="phone" placeholder="600 000 000">
        </div>
        <div class="form-group">
          <label>Foto de perfil (opcional)</label>
          <input type="file" id="reg-avatar" name="avatar" accept="image/*">
        </div>
        <div class="form-group">
          <label>Correo electrónico</label>
          <input type="email" id="reg-email" name="email" placeholder="tu@email.com" required>
        </div>
        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" id="reg-password" name="password" placeholder="Mínimo 6 caracteres" required minlength="6">
        </div>
        <button type="submit" id="btn-reg" class="btn">Registrarse</button>
      </form>

      <p class="toggle">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
      <p id="message"></p>
    </div>
  </main>

  <footer>
    <p>Roda Trabajo © 2026 · <a href="mailto:info@rodatrabajo.com">info@rodatrabajo.com</a></p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://ctkiiimazwpztekwfnrn.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_xkq1LHED5KxRpR35NRciCw_Na00Hi87';
    const cliente = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const msg = document.getElementById('message');
      const btn = document.getElementById('btn-reg');
      msg.style.color = '#78716c';
      msg.textContent = 'Creando cuenta...';
      btn.disabled = true;

      const role = document.getElementById('reg-role').value;
      const name = document.getElementById('reg-name').value.trim();
      const phone = document.getElementById('reg-phone').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;
      const avatarFile = document.getElementById('reg-avatar').files[0];

      try {
        // 1. Crear el usuario en Supabase Auth
        const { data, error: authError } = await cliente.auth.signUp({
          email,
          password,
          options: {
            data: { user_role: role, full_name: name, phone: phone }
          }
        });

        if (authError && !authError.message.includes('email') && !authError.message.includes('sending')) {
          throw new Error('Error en el registro: ' + authError.message);
        }

        // Si Supabase devuelve el usuario directamente o podemos iniciar sesión para obtener su ID
        let userId = data?.user?.id;

        if (!userId) {
          // Intentamos hacer login rápido para capturar el ID
          const { data: loginData } = await cliente.auth.signInWithPassword({ email, password });
          userId = loginData?.user?.id;
        }

        // Si aun así no tenemos ID (porque requiere confirmación estricta), avisamos que vaya a iniciar sesión
        if (!userId) {
          msg.style.color = '#166534';
          msg.textContent = '¡Cuenta creada! Ya puedes iniciar sesión.';
          setTimeout(() => { window.location.href = 'login.html'; }, 1500);
          return;
        }

        let avatarUrl = '';

        // 2. Subir foto de perfil si se seleccionó
        if (avatarFile) {
          msg.textContent = 'Subiendo imagen...';
          const fileExt = avatarFile.name.split('.').pop();
          const filePath = `${userId}-${Date.now()}.${fileExt}`;
          
          const { error: uploadError } = await cliente.storage
            .from('avatars')
            .upload(filePath, avatarFile, { upsert: true });

          if (!uploadError) {
            const { data: urlData } = cliente.storage
              .from('avatars')
              .getPublicUrl(filePath);
            avatarUrl = urlData.publicUrl;
          }
        }

        // 3. Guardar en la tabla public.profiles
        msg.textContent = 'Guardando perfil...';
        await cliente.from('profiles').upsert({
          id: userId,
          email: email,
          full_name: name,
          phone: phone,
          role: role,
          avatar_url: avatarUrl
        });

        msg.style.color = '#166534';
        msg.textContent = '¡Cuenta creada con éxito! Redirigiendo...';
        setTimeout(() => { window.location.href = 'index.html'; }, 1200);

      } catch (err) {
        console.error(err);
        btn.disabled = false;
        btn.textContent = 'Registrarse';
        msg.style.color = '#b91c1c';
        msg.textContent = err.message;
      }
    });
  </script>
</body>
</html>
