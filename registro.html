<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Roda Trabajo</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --brand-900: #1a1a1a;
      --brand-800: #3A2414;
      --brand-600: #6B4423;
      --brand-500: #8B5E3C;
      --brand-100: #f0e6d8;
      --muted: #78716c;
      --border: #e7e5e4;
      --bg: #fafaf9;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: #1c1917;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #fff;
      border-bottom: 1px solid var(--border);
    }
    .nav {
      max-width: 1100px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--brand-900);
      font-weight: 800;
      font-size: 18px;
    }
    .logo-mark {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: var(--brand-900);
      color: var(--brand-100);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 900;
    }
    .back {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      text-decoration: none;
    }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }
    .box {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.04);
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      text-align: center;
      color: var(--brand-900);
      margin-bottom: 6px;
    }
    .sub {
      text-align: center;
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 22px;
    }
    .form-group { margin-bottom: 14px; }
    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
      color: var(--brand-900);
    }
    input, select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      background: #fafaf9;
    }
    input:focus, select:focus {
      outline: none;
      border-color: var(--brand-500);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(139, 94, 60, 0.12);
    }
    .btn {
      width: 100%;
      padding: 13px;
      background: var(--brand-600);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      margin-top: 6px;
    }
    .btn:hover { background: var(--brand-800); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .toggle {
      text-align: center;
      margin-top: 18px;
      font-size: 14px;
      color: var(--muted);
    }
    .toggle a {
      color: var(--brand-600);
      font-weight: 700;
      text-decoration: none;
    }
    #message {
      text-align: center;
      margin-top: 14px;
      font-size: 13px;
      font-weight: 500;
    }
    footer {
      background: var(--brand-900);
      color: #a8a29e;
      font-size: 13px;
      text-align: center;
      padding: 20px;
    }
    footer a { color: #e7e5e4; }
  </style>
</head>
<body>

  <header>
    <div class="nav">
      <a href="index.html" class="logo">
        <div class="logo-mark">RT</div>
        <span>Roda Trabajo</span>
      </a>
      <a href="index.html" class="back"><i class="fa-solid fa-arrow-left"></i> Inicio</a>
    </div>
  </header>

  <main>
