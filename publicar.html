<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Publicar anuncio gratis - Roda Trabajo</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
          colors: { brand: { 50: '#f0fdf4', 100: '#dcfce7', 500: '#22c55e', 600: '#16a34a', 700: '#15803d' } }
        }
      }
    }
  </script>
  <style>
    .glass-nav { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col justify-between">

  <!-- HEADER -->
  <header class="sticky top-0 z-40 glass-nav border-b border-slate-200/85">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2.5">
        <div class="w-10 h-10 rounded-xl overflow-hidden shadow-md shadow-brand-500/20 flex flex-col border border-slate-200">
          <div class="h-1/4 bg-red-600 w-full"></div>
          <div class="h-2/4 bg-yellow-500 w-full"></div>
          <div class="h-1/4 bg-red-600 w-full"></div>
        </div>
        <span class="text-xl font-black tracking-tight text-slate-900">RODA TRABAJO</span>
      </a>
      <a href="index.html" class="px-4 py-2 text-sm font-semibold text-slate-700 hover:text-brand-600 flex items-center gap-1.5">
        <i class="fa-solid fa-arrow-left"></i> <span>Volver al inicio</span>
      </a>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="max-w-2xl mx-auto px-4 py-10 w-full flex-1">
    <div class="bg-white p-6 sm:p-10 rounded-3xl shadow-xl border border-slate-200/80 space-y-8">
      
      <div class="space-y-2 border-b border-slate-100 pb-6">
        <span class="px-3 py-1 bg-brand-100 text-brand-700 text-xs font-bold rounded-full uppercase tracking-wider">Nueva Oferta</span>
        <h1 class="text-2xl sm:text-3xl font-black text-slate-900">Publicar anuncio gratis</h1>
        <p class="text-slate-500 text-sm">Completa el formulario. Tu anuncio se revisará antes de publicarse.</p>
      </div>

      <div id="message" class="hidden p-4 rounded-xl text-sm font-medium"></div>

      <form id="ad-form" class="space-y-5">
        
        <div class="space-y-1">
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-600">Título del anuncio *</label>
          <input type="text" name="title" required placeholder="Ej: Se busca repartidor con carnet B" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand-500 focus:bg-white">
        </div>

        <div class="space-y-1">
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-600">Sector profesional *</label>
          <select name="category" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-700 focus:outline-none focus:border-brand-500 focus:bg-white cursor-pointer">
            <option value="" disabled selected>Selecciona un sector...</option>
            <option value="Construcción y reformas">🏗️ Construcción y reformas</option>
            <option value="Limpieza">🧹 Limpieza</option>
            <option value="Hostelería y turismo">🍽️ Hostelería y turismo</option>
            <option value="Transporte y conducción">🚚 Transporte y conducción</option>
            <option value="Logística y almacén">📦 Logística y almacén</option>
            <option value="Administración y oficina">📋 Administración y oficina</option>
            <option value="Comercio y ventas">🛍️ Comercio y ventas</option>
            <option value="Atención al cliente">🎧 Atención al cliente</option>
            <option value="Informática y tecnología">💻 Informática y tecnología</option>
            <option value="Sanidad">🏥 Sanidad</option>
            <option value="Educación">🎓 Educación</option>
            <option value="Mantenimiento y reparaciones">🔧 Mantenimiento y reparaciones</option>
            <option value="Agricultura y campo">🌾 Agricultura y campo</option>
            <option value="Industria">🏭 Industria</option>
            <option value="Peluquería y estética">✂️ Peluquería y estética</option>
            <option value="Cuidado de personas">❤️ Cuidado de personas</option>
            <option value="Marketing y comunicación">📣 Marketing y comunicación</option>
            <option value="Trabajo doméstico">🏠 Trabajo doméstico</option>
            <option value="Otros sectores">➕ Otros sectores</option>
          </select>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="space-y-1">
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600">Provincia *</label>
            <input type="text" name="city" required placeholder="Ej: Madrid" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand-500 focus:bg-white">
          </div>
          <div class="space-y-1">
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600">Sueldo / Salario</label>
            <input type="text" name="sueldo" placeholder="Ej: 1.200€ / A convenir" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand-500 focus:bg-white">
          </div>
        </div>

        <div class="space-y-1">
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-600">Descripción del puesto *</label>
          <textarea name="description" rows="5" required placeholder="Detalla las condiciones, requisitos y detalles del puesto..." class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand-500 focus:bg-white"></textarea>
        </div>

        <button type="submit" id="btn-submit" class="w-full py-4 bg-brand-600 hover:bg-brand-700 text-white font-bold text-sm rounded-xl shadow-lg shadow-brand-500/20 transition-all flex items-center justify-center gap-2 cursor-pointer mt-6">
          <i class="fa-solid fa-paper-plane"></i>
          <span>Publicar anuncio gratis</span>
        </button>

      </form>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="bg-slate-900 text-slate-400 text-sm border-t border-slate-800 py-6 mt-16 text-center">
    <p>© 2026 Roda Trabajo. Todos los derechos reservados.</p>
  </footer>

  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://ctkiiimazwpztekwfnrn.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_xkq1LHED5KxRpR35NRciCw_Na00Hi87';
    const cliente = window.supabaseClient || window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.getElementById('ad-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msgBox = document.getElementById('message');
      const btn = document.getElementById('btn-submit');
      
      msgBox.style.display = 'block';
      msgBox.className = 'p-4 rounded-xl text-sm font-medium bg-slate-100 text-slate-700 border border-slate-200 block';
      msgBox.textContent = 'Enviando anuncio...';
      btn.disabled = true;

      const { data: { session } } = await cliente.auth.getSession();
      if (!session) {
        msgBox.className = 'p-4 rounded-xl text-sm font-medium bg-red-50 text-red-600 border border-red-100 block';
        msgBox.textContent = 'Debes iniciar sesión para publicar.';
        setTimeout(() => { window.location.href = 'login.html'; }, 1500);
        return;
      }

      const formData = new FormData(e.target);
      const adData = {
        title: formData.get('title'),
        category: formData.get('category'),
        city: formData.get('city'),
        sueldo: formData.get('sueldo') || 'A convenir',
        description: formData.get('description'),
        status: 'pending',
        user_id: session.user.id
      };

      const { error } = await cliente.from('ads').insert([adData]);

      if (error) {
        msgBox.className = 'p-4 rounded-xl text-sm font-medium bg-red-50 text-red-600 border border-red-100 block';
        msgBox.textContent = 'Error: ' + error.message;
        btn.disabled = false;
      } else {
        msgBox.className = 'p-4 rounded-xl text-sm font-medium bg-emerald-50 text-emerald-700 border border-emerald-100 block';
        msgBox.textContent = '¡Anuncio publicado con éxito! Redirigiendo...';
        e.target.reset();
        setTimeout(() => { window.location.href = 'index.html'; }, 2000);
      }
    });
  </script>
</body>
</html>
