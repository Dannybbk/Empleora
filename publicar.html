<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Publicar Anuncio - Roda Trabajo</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans p-6">
  <div class="max-w-xl mx-auto bg-white p-8 rounded-2xl shadow-md border border-slate-200">
    <h1 class="text-2xl font-black mb-6 text-slate-900">Publicar un nuevo anuncio</h1>
    
    <div id="message" class="mb-4 text-sm font-semibold"></div>

    <form id="ad-form" class="space-y-4">
      <div>
        <label class="block text-sm font-bold mb-1">Título del puesto / Anuncio</label>
        <input type="text" name="title" required placeholder="Ej. Repartidor en moto" class="w-full p-3 border rounded-xl">
      </div>
      <div>
        <label class="block text-sm font-bold mb-1">Categoría</label>
        <input type="text" name="category" required placeholder="Ej. Transporte" class="w-full p-3 border rounded-xl">
      </div>
      <div>
        <label class="block text-sm font-bold mb-1">Ciudad / Ubicación</label>
        <input type="text" name="city" required placeholder="Ej. Madrid" class="w-full p-3 border rounded-xl">
      </div>
      <div>
        <label class="block text-sm font-bold mb-1">Sueldo (Opcional - Solo para ofertas)</label>
        <input type="text" name="salary" placeholder="Ej. 1300€ / mes" class="w-full p-3 border rounded-xl">
      </div>
      <div>
        <label class="block text-sm font-bold mb-1">Descripción</label>
        <textarea name="description" rows="4" required placeholder="Detalles del puesto..." class="w-full p-3 border rounded-xl"></textarea>
      </div>
      <button type="submit" class="w-full py-3 bg-green-600 text-white font-bold rounded-xl shadow-md hover:bg-green-700 transition-all">Publicar anuncio</button>
    </form>
    
    <div class="mt-4 text-center">
      <a href="perfil.html" class="text-sm font-semibold text-blue-600 hover:underline">&larr; Volver a mi perfil</a>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://ctkiiimazwpztekwfnrn.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_xkq1LHED5KxRpR35NRciCw_Na00Hi87';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.addEventListener('DOMContentLoaded', async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      const msg = document.getElementById('message');
      const form = document.getElementById('ad-form');

      if (!session) {
        msg.style.color = 'red';
        msg.innerHTML = 'Debes <a href="login.html" class="underline">iniciar sesión</a> para publicar un anuncio.';
        form.style.display = 'none';
        return;
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        msg.style.color = '#666';
        msg.textContent = 'Guardando y publicando anuncio...';

        const userId = session.user.id;

        // Buscamos el nombre y avatar actual del usuario en la tabla profiles para guardarlo directamente en el anuncio
        let userName = session.user.email.split('@')[0];
        let userAvatar = '';

        const { data: perfil } = await supabaseClient
          .from('profiles')
          .select('full_name, avatar_url')
          .eq('id', userId)
          .single();

        if (perfil) {
          if (perfil.full_name) userName = perfil.full_name;
          if (perfil.avatar_url) userAvatar = perfil.avatar_url;
        }

        const adData = {
          user_id: userId,
          title: form.title.value,
          category: form.category.value,
          city: form.city.value,
          salary: form.salary.value || null,
          description: form.description.value,
          contact_info: session.user.email,
          // Guardamos los datos del autor directamente en columnas del anuncio
          author_name: userName,
          author_avatar: userAvatar,
          status: 'published'
        };

        const { error } = await supabaseClient.from('ads').insert([adData]);

        if (error) {
          msg.style.color = 'red';
          msg.textContent = 'Error al publicar: ' + error.message;
        } else {
          msg.style.color = 'green';
          msg.textContent = '¡Anuncio publicado con éxito!';
          form.reset();
          setTimeout(() => {
            window.location.href = 'perfil.html';
          }, 1500);
        }
      });
    });
  </script>
</body>
</html>
